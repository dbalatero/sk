name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  rust:
    name: Rust (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - name: Check out source
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - name: Install Nix
        uses: cachix/install-nix-action@d698718aa798980d17dd749f03beae0b51183399 # v31
      - name: Check formatting
        run: nix develop --command cargo fmt --check
      - name: Lint
        run: nix develop --command cargo clippy --locked --all-targets -- -D warnings
      - name: Test
        run: nix develop --command cargo test --locked
